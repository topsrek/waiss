# Builds waiss.teloscircle.com: the decks (tools/deck.py), their PNGs (tools/export-deck.js) and the site (tools/site.py).
# Pull requests only build, so contributors see whether their slides render.
# On main, the result (dist/, with its Dockerfile) is force-pushed to the `site` branch as a single commit. Coolify on
# the Telos server serves that branch and redeploys on every new commit (coolify-poller).
# The nightly run moves an edition from "Upcoming" to "Past" for visitors without JavaScript (the page does it live).
name: site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: sitemap.xml takes lastmod from the last commit per page
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the deck and its slide images
        run: npm run deck
      - name: Build the site
        run: npm run site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Push dist/ to the site branch
        working-directory: dist
        run: |
          git init -q -b site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
