server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log off;          # no IP addresses stored (see /privacy/)
  absolute_redirect off;   # /1 -> /1/ without leaking the container port behind Traefik
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/calendar;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  location ~* \.(woff2|webp|png|svg|pdf)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
  }
  error_page 404 /404.html;
}
