server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  access_log off;          # no IP addresses stored (see /privacy/)
  absolute_redirect off;   # /1 -> /1/ without leaking the container port behind Traefik
  server_tokens off;

  charset utf-8;
  charset_types text/plain text/markdown text/xml text/css application/javascript text/calendar application/manifest+json;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json text/calendar text/plain text/markdown
             text/xml application/manifest+json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }
  # slides.md (text version of a deck) and the web manifest: nginx's mime.types knows neither
  location ~* \.md$ {
    types { } default_type text/markdown;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
  }
  location = /site.webmanifest {
    types { } default_type application/manifest+json;
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
  }
  location ~* \.(woff2|webp|png|jpg|ico|svg|pdf|mp4)$ {
    add_header Cache-Control "public, max-age=86400";
    add_header X-Content-Type-Options nosniff always;
  }
  error_page 404 /404.html;
}
