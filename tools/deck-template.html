<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
__FONTS__
<style>
:root{--ink:__INK__;--muted:__MUTED__;--grad:__GRAD__}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#EDEAE2;color:var(--ink);font-family:'Archivo',sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;margin:-540px 0 0 -960px;
  transform:scale(var(--k,1));transform-origin:50% 50%;background:var(--grad);overflow:hidden;cursor:default}
#blob{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
.slide{position:absolute;left:0;top:0;width:1920px;height:1080px;opacity:0;visibility:hidden;
  transition:opacity .25s ease,visibility 0s .25s}
.slide.on{opacity:1;visibility:visible;transition:opacity .55s ease .45s,visibility 0s}
.abs{position:absolute}
.mono{font-family:'IBM Plex Mono',monospace;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:24px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h2{margin:0;font-family:'Tektur',sans-serif;font-weight:800;line-height:1.0;letter-spacing:0}
.row{display:flex;gap:40px;align-items:baseline;border-top:2px solid var(--ink);padding:26px 0}
.row .n{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:28px;width:110px;flex:none}
.row .t{font-size:40px;font-weight:500}
.row .d{font-size:28px;color:var(--muted);margin-left:auto}
.qr{display:flex;flex-direction:column;gap:30px;width:var(--s,290px)}
.qr .tile{width:var(--s,290px);height:var(--s,290px);background:__TILE__;border-radius:calc(var(--s,290px)*.14);
  outline:2px solid var(--ink);outline-offset:10px;padding:calc(var(--s,290px)*.085);display:flex}
.qr .tile svg{width:100%;height:100%;display:block}
.qr .tile.ph{outline-style:dashed;align-items:center;justify-content:center;background:rgba(252,251,248,.6)}
.qr .u{font-family:'IBM Plex Mono',monospace;font-size:21px;color:var(--ink);line-height:1.25}

.tw{background:__TILE__;border-radius:36px;outline:2px solid var(--ink);outline-offset:10px;padding:40px 44px;display:flex;flex-direction:column;gap:26px}
.tw .head{display:flex;align-items:center;gap:20px}
.tw .av{width:76px;height:76px;border-radius:50%;border:2px solid var(--ink);overflow:hidden;display:flex;align-items:center;justify-content:center;flex:none}
.tw .av img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.tw .who{display:flex;flex-direction:column;gap:6px;line-height:1.1}
.tw .who b{font-size:34px;font-weight:700}
.tw .who span{font-family:'IBM Plex Mono',monospace;font-size:24px;color:var(--muted)}
.tw .x{margin-left:auto;width:38px;height:38px}
.tw .body{font-weight:500;line-height:1.28}
.tw .media{border:2px solid var(--ink);border-radius:24px;display:flex;align-items:center;justify-content:center;background:rgba(245,243,238,.7);overflow:hidden}
.tw .media img{width:100%;height:100%;object-fit:cover;filter:grayscale(1)}
.vid{position:relative;cursor:pointer;border-radius:18px;outline:2px solid var(--ink);outline-offset:8px;background:#000;overflow:hidden}
.vid video{width:100%;height:100%;display:block;object-fit:cover}
.vid .play{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
  background:__TILE__;outline:2px solid var(--ink);outline-offset:8px;display:flex;align-items:center;justify-content:center;
  transition:opacity .2s ease}
.vid .play svg{width:72px;height:72px;margin-left:10px;fill:var(--ink)}
.vid.on .play{opacity:0}
.tw .foot{font-family:'IBM Plex Mono',monospace;font-size:22px;color:var(--muted);display:flex;justify-content:space-between;border-top:1px solid var(--muted);padding-top:20px}

@page{size:1920px 1080px;margin:0}
html.print,html.print body{height:auto;overflow:visible;background:none}
html.print #stage{position:static;margin:0;transform:none;width:auto;height:auto;background:none;overflow:visible}
html.print #blob,html.print .vid .play{display:none}
html.print .slide{position:relative;opacity:1;visibility:visible;transition:none;overflow:hidden;background:var(--grad);
  break-after:page;page-break-after:always}
html.print .slide canvas.pb{position:absolute;left:0;top:0;width:1920px;height:1080px}
</style>
</head>
<body>
<div id="stage">
<canvas id="blob" width="1920" height="1080" aria-hidden="true"></canvas>
__SLIDES__
</div>
<script>
const FS=`__FS__`;
const PRESETS=__PRESETS__;
const W=1920,H=1080;
const PRINT=/[?&]print\b/.test(location.search);
const slides=[...document.querySelectorAll('.slide')];
const cams=slides.map(s=>{const [z,sx,sy,r]=s.dataset.cam.split(',').map(Number);return{z,sx,sy,r};});
const target=c=>{const [ph,rot,b]=PRESETS[__VARIANT__];return{b:b.slice(),ph,rot:rot+c.r*Math.PI/180,cam:[c.z,c.sx,c.sy]};};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

function createBlob(cv){
  const gl=cv.getContext('webgl',{alpha:true,premultipliedAlpha:true,antialias:false,preserveDrawingBuffer:true});
  if(!gl)return null;
  const mk=(t,s)=>{const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))console.warn('[WAISS]',gl.getShaderInfoLog(sh));return sh;};
  const p=gl.createProgram();
  gl.attachShader(p,mk(gl.VERTEX_SHADER,'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(p,mk(gl.FRAGMENT_SHADER,FS));gl.linkProgram(p);gl.useProgram(p);
  gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const l=gl.getAttribLocation(p,'a');gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(p,n);
  const u={res:U('uRes'),b:U('uB[0]'),warp:U('uWarp'),ph:U('uPhase'),rot:U('uRot'),cam:U('uCam'),shine:U('uShine'),spike:U('uSpike')};
  return{draw(s,ph,warp,k){
    const w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;}
    gl.viewport(0,0,w,h);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
    gl.uniform2f(u.res,w,h);gl.uniform4fv(u.b,new Float32Array(s.b));
    gl.uniform1f(u.warp,warp);gl.uniform1f(u.ph,ph);gl.uniform1f(u.rot,s.rot);
    gl.uniform3f(u.cam,s.cam[0],s.cam[1],s.cam[2]);gl.uniform1f(u.shine,0.8);gl.uniform1f(u.spike,0.8);
    gl.drawArrays(gl.TRIANGLES,0,3);}};
}
const ready=()=>document.fonts.ready.then(()=>{document.documentElement.dataset.ready='1';});

if(PRINT){
  // PDF fallback: every slide gets its own, static blob. One WebGL context draws them one after the other into
  // plain 2D canvases (Chrome allows only 16 WebGL contexts), after load so page.goto() doesn't time out.
  document.documentElement.classList.add('print');
  const gcv=document.createElement('canvas');gcv.width=W;gcv.height=H;
  const shots=slides.map(sl=>{const cv=document.createElement('canvas');cv.className='pb';cv.width=W;cv.height=H;
    sl.insertBefore(cv,sl.firstChild);return cv;});
  addEventListener('load',async()=>{
    const b=createBlob(gcv);
    for(let i=0;b&&i<slides.length;i++){
      const s=target(cams[i]);b.draw(s,s.ph,0.05,1);
      shots[i].getContext('2d').drawImage(gcv,0,0);
      await new Promise(r=>setTimeout(r,0));
    }
    ready();
  });
}else{
  const cv=document.getElementById('blob'),blob=createBlob(cv),stage=document.getElementById('stage');
  let scale=1,idx=-1,cur=null,raf=0;
  const quality=()=>{const dpr=Math.min(devicePixelRatio||1,1.5),cap=Math.sqrt(2.4e6/(W*H));
    return Math.max(.5,Math.min(dpr*scale,cap,1.5));};
  const fit=()=>{scale=Math.min(innerWidth/W,innerHeight/H);stage.style.setProperty('--k',scale);
    if(cur&&blob)blob.draw(cur,cur.ph,0.05,quality());};
  addEventListener('resize',fit);

  function animate(from,goal){
    cancelAnimationFrame(raf);
    const t0=performance.now(),dur=1100,lerp=(a,b,e)=>a+(b-a)*e;
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      const s={b:from.b.map((v,i)=>lerp(v,goal.b[i],e)),ph:lerp(from.ph,goal.ph,e),rot:lerp(from.rot,goal.rot,e),
               cam:from.cam.map((v,i)=>lerp(v,goal.cam[i],e))};
      cur=s;
      blob.draw(s,s.ph,0.05,k<1?quality()*.5:quality()); // fixed shape: only rotation + camera move
      if(k<1)raf=requestAnimationFrame(step);else cur=goal;
    };
    raf=requestAnimationFrame(step);
  }
  function go(n,instant){
    n=Math.max(0,Math.min(slides.length-1,n));
    if(n===idx)return;
    const first=idx<0;idx=n;
    slides.forEach((s,i)=>{s.classList.toggle('on',i===n);
      if(i!==n)s.querySelectorAll('.vid').forEach(w=>{const v=w.querySelector('video');w.classList.remove('on');
        if(v.src){v.pause();v.currentTime=0;}});});
    history.replaceState(null,'','#'+(n+1));
    if(!blob)return;
    const goal=target(cams[n]);
    if(cur){const d=goal.rot-cur.rot;goal.rot=cur.rot+Math.atan2(Math.sin(d),Math.cos(d));} // shortest way round
    if(first||instant||reduce){cancelAnimationFrame(raf);cur=goal;blob.draw(goal,goal.ph,0.05,quality());}
    else animate(cur,goal);
  }
  // a video is fetched on its first click (muted, looped); later clicks pause / resume it
  function toggle(w){
    const v=w.querySelector('video');
    if(!v.src){v.muted=true;v.src=v.dataset.src;}
    if(v.paused){v.play().catch(()=>{});w.classList.add('on');}else{v.pause();w.classList.remove('on');}
  }
  addEventListener('keydown',e=>{
    if(e.metaKey||e.ctrlKey||e.altKey)return;
    if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){go(idx+1);e.preventDefault();}
    else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){go(idx-1);e.preventDefault();}
    else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);
    else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
  });
  // after any click the keys belong to the deck again: nothing (link, video) keeps the focus
  addEventListener('click',e=>{
    const w=e.target.closest('.vid');
    if(w)toggle(w);else if(!e.target.closest('a'))go(e.clientX<innerWidth/3?idx-1:idx+1);
    setTimeout(()=>{if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();});
  });
  addEventListener('mousedown',e=>{if(e.target.closest('.vid'))e.preventDefault();}); // no focus, no text selection
  addEventListener('hashchange',()=>go((parseInt(location.hash.slice(1))||1)-1));
  fit();
  go((parseInt(location.hash.slice(1))||1)-1,true);
  ready();
}
window.DECK={count:slides.length};
</script>
</body>
</html>
